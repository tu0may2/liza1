<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Платформа продаж</title>
  <meta name="description" content="Учёт контрагентов, заказов, документов и оплат: история по каждому контрагенту, график платежей, аналитика.">
  <link rel="stylesheet" href="static/css/app.css">
  <!-- Значок подставляется скриптом под текущую тему; здесь запасной вариант
       на случай, если тема ещё не применилась. -->
  <link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cg fill='%234da8ff'%3E%3Cpath d='M33.2 58 C36 34 44 17 61 12.5 C50 24 40 40 33.2 58 Z'/%3E%3Cpath d='M30.8 58 C28 34 20 17 3 12.5 C14 24 24 40 30.8 58 Z'/%3E%3C/g%3E%3C/svg%3E">
</head>
<body>
  <header class="topbar">
    <div class="topbar__brand">
      <span class="topbar__logo" id="logo" aria-hidden="true"></span>
      <div>
        <h1>Платформа продаж</h1>
        <p class="topbar__subtitle">Контрагенты · документы · оплаты · аналитика</p>
      </div>
    </div>

    <div class="topbar__actions">
      <button class="btn btn--icon" id="btn-theme" type="button" title="Сменить тему"></button>
      <button class="btn" data-act="cp-new" type="button">+ Контрагент</button>
      <button class="btn btn--primary" data-act="order-new" type="button">+ Новый заказ</button>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Разделы"></nav>

  <main id="main"></main>

  <!-- Порядок важен: format и store не зависят ни от кого, charts берёт
       форматирование, app использует всё остальное. Обычные скрипты, а не
       модули: страница должна открываться прямо из файла, без сервера.
       files.js хранит вложения в IndexedDB и нужен store.js при удалении. -->
  <script src="static/js/format.js"></script>
  <script src="static/js/files.js"></script>
  <script src="static/js/store.js"></script>
  <script src="static/js/charts.js"></script>
  <script src="static/js/app.js"></script>
</body>
</html>
