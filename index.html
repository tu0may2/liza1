<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Платформа продаж</title>
  <meta name="description" content="Учёт контрагентов, заказов, документов и оплат: история по каждому контрагенту, график платежей, аналитика.">
  <link rel="stylesheet" href="static/css/app.css">
  <!-- Значок подставляется скриптом под текущую тему; здесь запасной вариант
       на случай, если тема ещё не применилась. -->
  <link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cg fill='%234da8ff'%3E%3Cpath d='M33.2 58 C36 34 44 17 61 12.5 C50 24 40 40 33.2 58 Z'/%3E%3Cpath d='M30.8 58 C28 34 20 17 3 12.5 C14 24 24 40 30.8 58 Z'/%3E%3C/g%3E%3C/svg%3E">
</head>
<body>
  <header class="topbar">
    <div class="topbar__brand">
      <span class="topbar__logo" id="logo" aria-hidden="true"></span>
      <div>
        <h1>Платформа продаж</h1>
        <p class="topbar__subtitle">Контрагенты · документы · оплаты · аналитика</p>
      </div>
    </div>

    <div class="topbar__actions">
      <button class="btn btn--primary" data-act="order-new" type="button">+ Новый заказ</button>

      <!-- Квадратик в правом верхнем углу: раскрывает меню со всем
           остальным, чтобы панель не разрасталась кнопками -->
      <div class="menu">
        <button class="btn btn--icon" id="btn-menu" type="button"
                aria-haspopup="true" aria-expanded="false" aria-label="Меню"></button>
        <div class="menu__panel" id="menu-panel" hidden>
          <div class="menu__label">Добавить</div>
          <button class="menu__item" data-act="order-new" type="button">Новый заказ</button>
          <button class="menu__item" data-act="cp-new" type="button">Контрагента</button>
          <button class="menu__item" data-act="pay-new" type="button">Оплату</button>
          <button class="menu__item" data-act="doc-new" type="button">Документ</button>
          <button class="menu__item" data-act="sched-new" type="button">Платёж в график</button>

          <div class="menu__sep"></div>
          <div class="menu__label">Перейти</div>
          <button class="menu__item" data-nav="analytics" type="button">Аналитика</button>
          <button class="menu__item" data-nav="history" type="button">История правок</button>
          <button class="menu__item" data-nav="data" type="button">Данные и копии</button>

          <div class="menu__sep"></div>
          <button class="menu__item" id="btn-theme" type="button"></button>
          <button class="menu__item" data-act="print" type="button">Печать экрана</button>
        </div>
      </div>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Разделы"></nav>

  <main id="main"></main>

  <!-- Котик выглядывает из-за нижнего края страницы -->
  <div class="page-cat" id="page-cat" aria-hidden="true"></div>

  <!-- Порядок важен: format ни от кого не зависит, files работает с
       сервером, store берёт их оба, app использует всё остальное.
       Обычные скрипты, а не модули: страницу отдаёт локальный сервер,
       сборка не нужна. -->
  <script src="static/js/format.js"></script>
  <script src="static/js/files.js"></script>
  <script src="static/js/store.js"></script>
  <script src="static/js/charts.js"></script>
  <script src="static/js/app.js"></script>
</body>
</html>
